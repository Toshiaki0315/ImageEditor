name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    # 対象と同じ Apple Silicon 環境で実行
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
